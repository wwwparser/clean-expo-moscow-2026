{% extends 'base.html' %}{% block body %}<header class="market-head"><p class="kicker">{{ config.name }} {{ config.edition }}</p><h1>Аналитика</h1><p class="lede">Отраслевые данные, контекст и выводы с указанием источников и ограничений.</p></header><section class="cards3">{% for a in items %}<article class="card"><p class="kicker">{{ a.date }}</p><h2><a href="{{ a.page }}">{{ a.title }}</a></h2><p>{{ a.summary }}</p><p class="small muted">{{ a.author }}</p><a href="{{ a.page }}">Читать материал →</a></article>{% endfor %}</section>{% endblock %}
